<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Solve - IET | BITOTSAV '26</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script> <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script> <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginScreen" class="container">
        <div class="header-badges">
            <span class="badge bitotsav">BITOTSAV 2026</span>
            <span class="badge iet">IET Student Chapter</span>
        </div>
        <h1 class="glow-text">SPLIT SOLVE</h1>
        <p class="subtitle">A true test of synchronization and logic.</p>
        
        <input type="text" id="teamId" placeholder="Enter Team Name...">
        <button onclick="login()" class="cyber-btn">Start Event</button>
        <p id="loginMessage" style="color: #ff5555;"></p>
        
        <p class="made-by">made with love ❤️ by Ashwini</p>
    </div>

    <div id="codingScreen" class="container hidden" style="max-width: 900px;">
        <h2 id="phaseTitle" class="glow-text">Phase 1: Member 1</h2>
        <h3 id="timer">Time Left: 5:00</h3>
        
        <textarea id="codeEditor"></textarea>
        
        <button id="actionBtn" onclick="savePhase()" class="cyber-btn" style="margin-top: 20px;">Save and Continue</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
